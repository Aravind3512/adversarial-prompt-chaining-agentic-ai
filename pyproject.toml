[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-chaining-benchmark"
version = "0.1.0"
description = "Safe synthetic benchmark for distributed prompt chaining in agentic AI workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Aravind Adari"},
  {name = "Vijaysimha Bandaru"}
]
dependencies = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "nbformat>=5.9",
  "jupyter>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
